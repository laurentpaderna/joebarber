SSLCertificateFile /etc/ssl/certs/joebarber.local.com.crt
SSLCertificateKeyFile /etc/ssl/private/joebarber.local.com.key

<VirtualHost *:80>
        ServerName  joebarber.local.com
        DocumentRoot /var/www/html/templates
        ErrorLog /var/log/apache2/joebarber.log
        TransferLog /var/log/apache2/joebarber.log

        SSLEngine on

        <Directory  "/var/www/html/templates">
            Options Indexes FollowSymLinks
            AllowOverride All
            Order deny,allow
            Allow from all
            Require all granted
        </Directory>
</VirtualHost>

<VirtualHost *:80 *:443>
        DocumentRoot /var/www/html/web
        ServerName  joebarber.local.com

        ErrorLog ${APACHE_LOG_DIR}/error.log
        CustomLog ${APACHE_LOG_DIR}/access.log combined

        SSLEngine on

        SSLCertificateFile /etc/ssl/certs/joebarber.local.com.crt
        SSLCertificateKeyFile /etc/ssl/private/joebarber.local.com.key

        <FilesMatch "\.(cgi|shtml|phtml|php)$">
              SSLOptions +StdEnvVars
        </FilesMatch>
        <Directory /usr/lib/cgi-bin>
              SSLOptions +StdEnvVars
        </Directory>
</VirtualHost>