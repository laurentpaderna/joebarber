services:
  joebarberapp:
    build:
      context: ./php
      dockerfile: Dockerfile
    container_name: joebarberapp
    restart: always
    volumes:
      - ../:/var/www/html
    ports:
      - "80:80"
      - "443:80"
    extra_hosts:
      - "joebarber.local.com:127.0.0.1"

  joebarberdb:
    build:
      context: ./mysql
    container_name: joebarberdb
    image: mysql:8.0
    env_file:
      - ./.env
    environment:
      MYSQL_ROOT_USER: ${APP_ROOT_USER}
      MYSQL_ROOT_PASSWORD: ${APP_ROOT_PASSWORD}
      MYSQL_DATABASE: ${APP_DATABASE}
      MYSQL_USER: ${APP_USER}
      MYSQL_PASSWORD: ${APP_PASSWORD}
    ports:
      - "3306:3306"
    volumes:
      - ./mysql-data:/var/lib/mysql
    restart: always

volumes:
    mysql-data:
