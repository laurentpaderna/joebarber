services:
  joebarberapp:
    build:
      context: ./php
      dockerfile: Dockerfile
    container_name: joebarberapp
    restart: always
    volumes:
      - ../:/var/www/html
    ports:
      - "80:80"
      - "443:80"
    extra_hosts:
      - "joebarber.local.com:127.0.0.1"

  joebarberdb:
    build:
      context: ./mysql
    container_name: joebarberdb
    image: mysql:8.0
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: joebarberdb
      MYSQL_USER: joe
      MYSQL_PASSWORD: barber
    ports:
      - "3306:3306"
    volumes:
      - ./mysql-data:/var/lib/mysql
    restart: always

volumes:
    mysql-data:
